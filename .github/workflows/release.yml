name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ""

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-lock.txt

      - name: Verify release inputs
        run: python scripts/verify_release_inputs.py

      - name: Verify application release version
        run: python -m scripts.prepare_package_metadata --check-release-ref

      - name: Prepare Windows version metadata
        run: python -m scripts.prepare_package_metadata --windows-version-file build/windows-version-info.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name IPA-Download-Tool --icon assets/exe.ico --version-file build/windows-version-info.txt --add-binary "ipatool-2.3.2-windows-amd64.exe;." --add-data "assets/exe.png;assets" --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;." --add-data "third_party;third_party" main.py
          python scripts/verify_built_archive.py dist/IPA-Download-Tool.exe
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "dev" }
          Move-Item dist/IPA-Download-Tool.exe "dist/IPA-Download-Tool-$version-windows-x86_64.exe"

      - name: Upload Windows asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x86_64
          path: dist/*-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS ${{ matrix.asset_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            asset_arch: x86_64
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: requirements-macos-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-macos-lock.txt

      - name: Verify Python environment
        run: python -m pip check

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Verify application release version
        run: python -m scripts.prepare_package_metadata --check-release-ref

      - name: Fetch pinned ipatool
        run: python -m scripts.fetch_ipatool_release --system Darwin --arch "${{ matrix.arch }}" --output-dir .

      - name: Build macOS app
        env:
          IPATOOL_ARCH: ${{ matrix.arch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          IPATOOL="ipatool-2.3.2-macos-$IPATOOL_ARCH"
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name IPA-Download-Tool --osx-bundle-identifier com.qianshulab.ipadownloadtool --add-binary "$IPATOOL:." --add-data "assets/exe.png:assets" --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." --add-data "third_party:third_party" main.py
          python -m scripts.prepare_package_metadata --macos-plist dist/IPA-Download-Tool.app/Contents/Info.plist
          codesign --force --deep --sign - dist/IPA-Download-Tool.app
          codesign --verify --deep --strict --verbose=2 dist/IPA-Download-Tool.app
          python - "$IPATOOL" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          expected = Path(sys.argv[1])
          matches = [
              path for path in Path("dist/IPA-Download-Tool.app").rglob(expected.name)
              if path.is_file()
          ]
          resolved_matches = {path.resolve(strict=True) for path in matches}
          if len(resolved_matches) != 1:
              raise SystemExit(
                  f"expected one bundled ipatool payload, found {len(resolved_matches)}"
              )
          actual = resolved_matches.pop()
          version = subprocess.run(
              [str(actual), "--version"],
              check=True,
              capture_output=True,
              text=True,
              timeout=10,
          )
          version_text = "\n".join((version.stdout, version.stderr)).strip()
          if "ipatool version 2.3.2" not in version_text:
              raise SystemExit(f"unexpected bundled ipatool version: {version_text}")
          archs = subprocess.run(
              ["lipo", "-archs", str(actual)],
              check=True,
              capture_output=True,
              text=True,
              timeout=10,
          ).stdout.split()
          expected_arch = os.environ["ASSET_ARCH"]
          if expected_arch not in archs:
              raise SystemExit(f"bundled ipatool architectures {archs} omit {expected_arch}")
          print(f"BUNDLED_IPATOOL={actual} VERSION=2.3.2 ARCH={expected_arch}")
          PY
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev"; fi
          ditto -c -k --sequesterRsrc --keepParent dist/IPA-Download-Tool.app "dist/IPA-Download-Tool-$VERSION-macos-$ASSET_ARCH.app.zip"

      - name: Upload macOS asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.asset_arch }}
          path: dist/*-macos-${{ matrix.asset_arch }}.app.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum IPA-Download-Tool-* > SHA256SUMS.txt

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes='桌面版支持 App Store 搜索、Apple ID 登录与 2FA、Bundle ID 下载、IPA 校验和原子保存。无法获得总字节数时，下载与校验阶段显示忙碌状态，仅在保存成功后显示 100%。Windows EXE 未进行 Authenticode 签名；macOS 应用未使用 Apple Developer ID 签名或公证。项目按 GPL-3.0-only 发布。'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --title "IPA Download Tool $tag" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          fi
